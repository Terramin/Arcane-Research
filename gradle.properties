# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Pin the JVM that runs Gradle: 8.x cannot run on Java 26 (major 70), use JDK 17.
org.gradle.java.home=C:/Program Files/Java/jdk-17

# Minecraft/Forge versions
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.3.0
forge_version_range=[47,)
loader_version_range=[47,)

# Mappings - Using official Mojang mappings
# To use Parchment (human-readable parameter names), uncomment the plugin in build.gradle
# and change to: mappings_channel=parchment, mappings_version=2023.09.03-1.20.1
# Note: Parchment requires Java 17-21 (not compatible with Java 25+)
mappings_channel=official
mappings_version=1.20.1

# Mod properties
mod_id=arcaneresearch
mod_name=Arcaneresearch
mod_license=All Rights Reserved
mod_version=6.2.0
mod_group_id=arcaneresearch
mod_authors=Azanor, Terramin
mod_description=Adding magical items, blocks, and creatures to help you on your journey.

# Curios API (replaces Baubles)
# NOTE: 5.14.1 is broken (its curios.mixins.json lacks AccessorEntity while
# CurioSlot uses it -> crash when equipping via GUI), so we pin 5.14.0.
curios_version=5.14.0+1.20.1
systemProp.net.minecraftforge.gradle.check.certs=false
